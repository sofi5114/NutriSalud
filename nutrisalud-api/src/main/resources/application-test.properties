# S14 · práctica 3: perfil test (@ActiveProfiles("test")) -> base nutrisalud_test
spring.datasource.url=${DB_URL_TEST:jdbc:sqlserver://localhost;instanceName=SQLEXPRESS;databaseName=nutrisalud_test;encrypt=true;trustServerCertificate=true}

# consola limpia en mvn test
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.generate_statistics=false
logging.level.org.hibernate.engine.internal.StatisticalLoggingSessionEventListener=WARN
logging.level.org.springframework.orm.jpa.JpaTransactionManager=INFO

# seguridad completa, como en producción
nutrisalud.seguridad.lectura-abierta=false
