spring.application.name=nutrisalud-api
server.port=8080

# S14 · práctica 3 (factor III): sin claves en el código.
# Valores desde variables de entorno o desde .env.properties (en .gitignore).
spring.config.import=optional:file:.env.properties

# ---------------------------------------------------------------- SQL Server
spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost;instanceName=SQLEXPRESS;databaseName=nutrisalud_s11;encrypt=true;trustServerCertificate=true}
# S14 · sin valor por defecto
spring.datasource.username=${DB_USUARIO}
spring.datasource.password=${DB_CLAVE}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# Semana 11: métricas por transacción
spring.jpa.properties.hibernate.generate_statistics=true
logging.level.org.hibernate.engine.internal.StatisticalLoggingSessionEventListener=INFO

# Semana 12: SQL y transacciones en consola
spring.jpa.show-sql=true
logging.level.org.springframework.orm.jpa.JpaTransactionManager=DEBUG

# ---------------------------------------------------------------- Seguridad
nutrisalud.seguridad.lectura-abierta=true
# S14 · secreto JWT sin valor por defecto
nutrisalud.jwt.secreto=${NUTRISALUD_JWT_SECRETO}
nutrisalud.jwt.minutos=120
nutrisalud.cors.origenes=${NUTRISALUD_CORS:http://localhost:4200}
