# Perfil prod: java -jar nutrisalud-api.jar --spring.profiles.active=prod

# S14 · práctica 3: todo lo sensible desde variables de entorno
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USUARIO}
spring.datasource.password=${DB_CLAVE}
nutrisalud.jwt.secreto=${NUTRISALUD_JWT_SECRETO}
nutrisalud.cors.origenes=${NUTRISALUD_CORS}

# Semana 11: Swagger apagado en producción
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# S14 · sin SQL ni métricas en consola
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.generate_statistics=false
logging.level.org.hibernate.engine.internal.StatisticalLoggingSessionEventListener=WARN
logging.level.org.springframework.orm.jpa.JpaTransactionManager=INFO

# S14 · en internet, leer pacientes también exige token
nutrisalud.seguridad.lectura-abierta=false
